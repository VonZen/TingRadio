<!doctype html>
{% assign language = page.language | default: site.default_language | default: 'en' %}
{% assign t = site.data.landing[language] %}
<html lang="{{ t.lang }}">
{% include head.html %}
<body data-language="{{ t.lang }}"{% if page.landing %} data-landing="true"{% endif %}>
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
