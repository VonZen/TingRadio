---
layout: default
---
{% assign language = page.language | default: 'en' %}
{% assign t = site.data.landing[language] %}
<article class="legal-page container">
  <a class="text-link" href="{{ t.home | relative_url }}">← {{ t.back_home }}</a>
  <p class="eyebrow legal-context">{{ t.legal_context }}</p>
  <div class="legal-content">{{ content }}</div>
</article>
