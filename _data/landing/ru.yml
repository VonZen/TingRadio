song_eyebrow: НЕ УПУСТИТЕ ХОРОШУЮ ПЕСНЮ
song_title: "Услышали.\nЗапомнили."
song_body: "Любимая песня может прозвучать неожиданно. Распознавайте музыку в поддерживаемых эфирах и возвращайтесь к истории песен."
song_steps:
  - title: Узнайте название песни
    body: Включите распознавание, пока играет поддерживаемая станция. Доступность зависит от потока и устройства.
  - title: Помните, где она звучала
    body: Название и сведения о станции сохраняются вместе с каждой песней, чтобы вернуться к станции, где она прозвучала.
  - title: Найдите песню позже
    body: История сохраняет названия и исполнителей песен, найденных во время прослушивания. Она хранит сведения о песнях, а не аудиозаписи.
song_art_label: МГНОВЕНИЕ СТАНОВИТСЯ ВОСПОМИНАНИЕМ
song_art_text: Песня, которой вам так не хватало.
song_note: "Некоторые станции поддерживают только обычное прослушивание. Распознавание и визуальные эффекты в такт музыке зависят от потока. На Apple Watch распознавание песен недоступно."
everyday_eyebrow: ХОРОШАЯ КОМПАНИЯ НА ВЕСЬ ДЕНЬ
everyday_title: Найдите время слушать.
everyday_body: Несколько продуманных деталей для привычного ритма дня.
scenes:
  - number: "01"
    title: Отдыхайте в своём ритме.
    body: Выберите бесплатный вариант таймера сна, чтобы воспроизведение остановилось, когда придёт время отдыхать. Pro позволяет задать своё время.
    label: Таймер сна
  - number: "02"
    title: Возьмите станции с собой.
    body: "Обычное прослушивание в CarPlay доступно бесплатно. Pro добавляет отдельный экран для вождения и подбор станций по жанру и настроению в CarPlay. Доступность зависит от вашего оборудования."
    label: Вождение и CarPlay
  - number: "03"
    title: Начните день с любимого.
    body: "Добавьте любимую станцию в утренний распорядок. Пусть начало дня радует."
    label: Пробуждение с радио*
alarm_note: "* Пробуждение с радио входит в Pro и требует iOS 26 или новее и разрешения на будильники. Сначала звучит системный будильник; затем нажмите «Открыть станцию», чтобы начать слушать."
devices_eyebrow: В ВАШЕМ МИРЕ APPLE
devices_title: Знакомо на любом устройстве.
devices_body: "Нативное приложение для iPhone, iPad, Mac и Apple Watch. Набор функций зависит от устройства."
devices:
  - {name: iPhone и iPad, requirement: "Требуется iOS / iPadOS 18+", body: "AirPlay, управление на экране блокировки и нативный интерфейс для прослушивания."}
  - {name: Mac, requirement: "Требуется macOS 15+", body: Отдельное нативное приложение для рабочего стола и повседневных дел.}
  - {name: Apple Watch, requirement: "Требуется watchOS 11+", body: Избранные и недавние станции и собственные адреса синхронизируются с сопряжённым iPhone.}
faq_eyebrow: ПЕРЕД ПЕРВЫМ ЭФИРОМ
faq_title: Несколько полезных ответов.
faqs:
  - question: Ting Radio бесплатное?
    answer: "Ting Radio можно скачать бесплатно. Обычное прослушивание радио, избранное, собственные станции и готовые интервалы таймера сна включены. Pro добавляет новые возможности для ваших станций."
  - question: Можно слушать без интернета или записать передачу?
    answer: "Ting Radio передаёт прямой радиоэфир через интернет. Офлайн-записи и повтор передач недоступны. Станции сами управляют потоками, содержанием и доступностью."
  - question: Всё синхронизируется между устройствами?
    answer: "Ting Radio поддерживает синхронизацию станций между iPhone и сопряжённым Apple Watch. Полная синхронизация библиотеки через учётную запись между всеми платформами не обещается."
  - question: Pro убирает рекламу радиостанций?
    answer: "Реклама станции является частью её аудиопотока. Ting Radio не может её удалить, и Pro не включает удаление рекламы."
