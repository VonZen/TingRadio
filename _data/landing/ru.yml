discovery_title: "Найдите станцию.\nОстаньтесь ради открытий."
discovery_body: "От выбора следующей станции до сохранения названия песни — познакомьтесь с Ting Radio поближе."
discovery_note: "Подборки учитывают ваши предпочтения и историю прослушивания. Избранное и собственные адреса станций помогают держать любимый эфир под рукой."
