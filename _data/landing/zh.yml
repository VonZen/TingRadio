  - {name: iPhone 与 iPad, requirement: "需要 iOS / iPadOS 18+", body: "AirPlay、锁屏控制，以及自然顺手的原生收听体验。"}
  - {name: Mac, requirement: "需要 macOS 15+", body: 为桌面打造的原生 App，陪伴工作，也陪伴闲暇。}
