song_note: "部分电台仅支持基础播放；识曲和音频响应可视化取决于音源。Apple Watch 不支持识曲。"
everyday_eyebrow: 从早到晚，好声音相伴
everyday_title: 给聆听，留一个位置。
everyday_body: 一些贴心的小功能，陪你走过一天里的不同片刻。
scenes:
  - number: "01"
    title: 慢慢听，安心入睡。
    body: 选择免费的睡眠定时预设，让播放在休息时结束。Pro 还支持自定义时长。
    label: 睡眠定时
  - number: "02"
    title: 熟悉的电台，一路相伴。
    body: "免费版包含 CarPlay 基础播放。Pro 增加专用驾驶视图，以及 CarPlay 中的曲风与心情探索。具体可用性取决于设备与使用环境。"
    label: 驾驶与 CarPlay
  - number: "03"
    title: 从喜欢的声音开始一天。
    body: "把喜欢的电台与起床时间放在一起，让清晨多一份期待。"
    label: 电台自动叫醒*
alarm_note: "* 电台自动叫醒为 Pro 功能，需要 iOS 26 及以上并允许闹钟权限。系统闹钟响铃后，点按「打开电台」开始收听。"
