faq_eyebrow: 开始聆听之前
faq_title: 你可能想知道。
faqs:
  - question: Ting Radio 是免费的吗？
    answer: "Ting Radio 可以免费下载。日常电台收听、收藏、自定义电台和睡眠定时预设均包含在免费版中，Pro 则提供更多收听功能。"
  - question: 可以离线听，或者录下节目吗？
    answer: "Ting Radio 通过互联网收听直播电台。不提供离线录音或节目回放。电台自行决定音频内容与服务可用性。"
  - question: 所有设备都会同步吗？
    answer: "Ting Radio 支持 iPhone 与配对 Apple Watch 的电台协同同步；目前不承诺所有平台之间的账户曲库同步。"
  - question: Pro 能去掉电台里的广告吗？
    answer: "电台播出的广告属于其自身音频流，Ting Radio 无法移除。Pro 权益也不包含去广告。"
