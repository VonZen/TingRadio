  - {name: iPhone y iPad, requirement: "Requiere iOS / iPadOS 18+", body: "AirPlay, controles en la pantalla de bloqueo y una experiencia de escucha nativa."}
  - {name: Mac, requirement: "Requiere macOS 15+", body: Una app nativa dedicada para tu escritorio y tu día a día.}
  - {name: Apple Watch, requirement: "Requiere watchOS 11+", body: "Tus favoritos, emisoras recientes y emisoras personalizadas se sincronizan con el iPhone enlazado."}
faq_eyebrow: ANTES DE SINTONIZAR
faq_title: Lo que conviene saber.
faqs:
  - question: ¿Ting Radio es gratis?
    answer: "La descarga de Ting Radio es gratuita. Incluye la escucha diaria de radio, los favoritos, las emisoras personalizadas y las duraciones predefinidas del temporizador de apagado. Pro añade más formas de disfrutar de tus emisoras."
  - question: ¿Puedo escuchar sin conexión o grabar un programa?
    answer: "Ting Radio transmite radio en directo por internet. No ofrece grabaciones sin conexión ni la posibilidad de volver a escuchar programas. Las emisoras controlan sus propias transmisiones, su contenido y su disponibilidad."
  - question: ¿Se sincroniza todo entre mis dispositivos?
    answer: "Ting Radio permite sincronizar emisoras entre el iPhone y su Apple Watch enlazado. No se promete una sincronización completa de la biblioteca mediante una cuenta en todas las plataformas."
  - question: ¿Pro elimina los anuncios de las emisoras?
    answer: "Los anuncios emitidos por una emisora forman parte de su propia transmisión de audio. Ting Radio no puede eliminarlos y Pro no incluye la eliminación de anuncios."
