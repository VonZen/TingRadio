song_eyebrow: NO DEJES ESCAPAR UNA BUENA CANCIÓN
song_title: "La escuchas.\nLa guardas."
song_body: "Una canción favorita puede llegar cuando menos te lo esperas. Identifica el audio de las emisoras compatibles, sigue las letras disponibles y vuelve a tu historial de canciones."
song_steps:
  - title: Ponle nombre a la canción
    body: Usa el reconocimiento de canciones mientras suena una emisora compatible. La disponibilidad depende de la transmisión y del dispositivo.
  - title: Sigue cada palabra
    body: Sigue las letras sincronizadas cuando estén disponibles. La sincronización y las palabras resaltadas dependen de la letra facilitada para cada canción.
  - title: Encuéntrala más tarde
    body: El historial de canciones conserva los títulos y artistas descubiertos mientras escuchas. Guarda información sobre las canciones, no grabaciones de audio.
song_art_label: DE UN INSTANTE A UN RECUERDO
song_art_text: Esa canción que no sabías que necesitabas.
song_note: "Algunas emisoras solo permiten la escucha básica. Las letras, el reconocimiento y los efectos visuales que reaccionan al audio dependen de la transmisión. El reconocimiento de canciones no está disponible en el Apple Watch."
everyday_eyebrow: BUENA COMPAÑÍA, TODO EL DÍA
everyday_title: Haz sitio para escuchar.
everyday_body: Pequeños detalles pensados para el ritmo real de tu día.
scenes:
  - number: "01"
    title: Descansa a tu manera.
    body: Elige una duración predefinida del temporizador de apagado gratuito y deja que la reproducción se detenga cuando toque descansar. Pro añade una duración personalizada.
    label: Temporizador de apagado
  - number: "02"
    title: Lleva tus emisoras contigo.
    body: "La escucha básica con CarPlay está incluida. Pro añade la vista de conducción dedicada y la exploración por género y estado de ánimo en CarPlay. La disponibilidad depende de tu equipo."
    label: Conducción y CarPlay
  - number: "03"
    title: Empieza con algo que te gusta.
    body: "Incorpora tu emisora favorita a tu rutina de mañana. Algo que esperar con ilusión al comenzar el día."
    label: Despertar con radio*
alarm_note: "* Despertar con radio es una función Pro que requiere iOS 26 o posterior y permiso para las alarmas. Primero suena la alarma del sistema; toca Abrir emisora para empezar a escuchar."
devices_eyebrow: EN CASA EN TU MUNDO APPLE
devices_title: Como en casa, donde escuches.
devices_body: "Una experiencia nativa para iPhone, iPad, Mac y Apple Watch. Las funciones varían según el dispositivo."
