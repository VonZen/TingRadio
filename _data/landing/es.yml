discovery_eyebrow: DENTRO DE TING RADIO
discovery_title: "Elige una emisora.\nQuédate a descubrir."
discovery_body: "Desde elegir tu próxima emisora hasta recordar una canción, un vistazo a cómo funciona Ting Radio."
discovery_note: "Los descubrimientos se basan en tus preferencias y tu historial de escucha. Los favoritos y las URL de emisoras personalizadas mantienen cerca tu propio rincón de la radio."
