faq_eyebrow: AVANT DE VOUS METTRE À L’ÉCOUTE
faq_title: Quelques repères utiles.
faqs:
  - question: Ting Radio est-il gratuit ?
    answer: "Ting Radio se télécharge gratuitement. L’écoute quotidienne de la radio, les favoris, les stations personnalisées et les durées prédéfinies du minuteur de veille sont inclus. Pro ajoute d’autres façons de profiter de vos stations."
  - question: Puis-je écouter hors ligne ou enregistrer une émission ?
    answer: "Ting Radio diffuse la radio en direct par internet. L’app ne propose ni enregistrements hors ligne ni réécoute des émissions. Les stations gèrent leurs propres flux, contenus et disponibilités."
  - question: Tout se synchronise-t-il entre mes appareils ?
    answer: "Ting Radio permet de synchroniser les stations entre l’iPhone et son Apple Watch jumelée. Une synchronisation complète de la bibliothèque au moyen d’un compte sur toutes les plateformes n’est pas promise."
  - question: Pro supprime-t-il les publicités des stations ?
    answer: "Les publicités diffusées par une station font partie de son propre flux audio. Ting Radio ne peut pas les supprimer, et Pro n’inclut pas la suppression des publicités."
