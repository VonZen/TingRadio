song_eyebrow: NE LAISSEZ PAS FILER UNE BELLE CHANSON
song_title: "Écoutée.\nRetrouvée."
song_body: "Une chanson préférée peut surgir quand on s’y attend le moins. Identifiez l’audio des stations compatibles, suivez les paroles disponibles et retrouvez votre historique de chansons."
song_steps:
  - title: Mettez un nom sur la chanson
    body: Utilisez la reconnaissance de chansons pendant la lecture d’une station compatible. Sa disponibilité dépend du flux et de l’appareil.
  - title: Suivez les paroles
    body: Suivez les paroles synchronisées lorsqu’elles sont disponibles. La synchronisation et la mise en évidence des mots dépendent des données de paroles fournies pour la chanson.
  - title: Retrouvez-la plus tard
    body: L’historique conserve les titres et les artistes découverts pendant l’écoute. Il enregistre des informations sur les chansons, sans enregistrer leur audio.
song_art_label: D’UN INSTANT À UN SOUVENIR
song_art_text: Cette chanson dont vous aviez besoin sans le savoir.
song_note: "Certaines stations permettent uniquement l’écoute de base. Les paroles, la reconnaissance et les visuels réagissant à l’audio dépendent du flux. La reconnaissance de chansons n’est pas disponible sur Apple Watch."
everyday_eyebrow: EN BONNE COMPAGNIE, TOUTE LA JOURNÉE
everyday_title: Faites une place à l’écoute.
everyday_body: Quelques attentions pensées pour le vrai rythme de vos journées.
scenes:
  - number: "01"
    title: Détendez-vous à votre rythme.
    body: Choisissez une durée prédéfinie du minuteur de veille gratuit et laissez la lecture s’arrêter à l’heure du repos. Pro ajoute une durée personnalisée.
    label: Minuteur de veille
  - number: "02"
    title: Emportez vos stations.
    body: "L’écoute de base avec CarPlay est incluse. Pro ajoute la vue dédiée à la conduite et la navigation par genre et humeur dans CarPlay. La disponibilité dépend de votre équipement."
    label: Conduite et CarPlay
  - number: "03"
    title: Commencez par ce que vous aimez.
    body: "Invitez votre station préférée dans votre routine du matin. Un petit plaisir à attendre au début de la journée."
    label: Réveil radio*
alarm_note: "* Le réveil radio est une fonction Pro qui nécessite iOS 26 ou une version ultérieure et l’autorisation des alarmes. L’alarme système sonne d’abord ; touchez Ouvrir la station pour commencer à écouter."
