intro_label: Un nuovo capitolo per Ting Radio
intro_text: "Meno ricerche. Più ascolto. Un’app nativa rinnovata che avvicina le nuove scoperte, le tue stazioni preferite e i brani che incontri lungo il cammino."
discovery_eyebrow: DENTRO TING RADIO
discovery_title: "Trova una stazione.\nResta per le scoperte."
discovery_body: "Dalla scelta della prossima stazione al ricordo di un brano, uno sguardo a come funziona Ting Radio."
discovery_note: "La scoperta tiene conto delle tue preferenze e della cronologia di ascolto. Preferiti e URL di stazioni personalizzate tengono vicino il tuo angolo di radio."
discovery_items:
  - {name: Jazz, detail: Un pomeriggio senza fretta., image: jazz.webp, alt: Un sassofono illuminato da una luce calda, kind: Genere}
  - {name: Concentrazione, detail: Un po’ di spazio per pensare., image: focus.webp, alt: Libri e una lampada da scrivania dalla luce calda, kind: Stato d’animo}
  - {name: Classica, detail: Lascia scorrere la giornata., image: classical.webp, alt: Un violino visto da vicino, kind: Genere}
  - {name: Relax, detail: Scegli la strada più lunga verso casa., image: chill.webp, alt: Nebbia sopra un tranquillo lago nel bosco, kind: Stato d’animo}
song_eyebrow: NON LASCIARTI SFUGGIRE UN BEL BRANO
song_title: "Lo ascolti.\nLo ritrovi."
song_body: "Un brano preferito può arrivare quando meno te lo aspetti. Riconosci l’audio delle radio supportate e ritrova i brani nella cronologia."
song_steps:
  - title: Dai un nome al brano
    body: Usa il riconoscimento brani mentre ascolti una stazione supportata. La disponibilità dipende dal flusso e dal dispositivo.
  - title: Ricorda dove è passato
    body: Il nome e i dettagli della stazione restano associati a ogni brano, così puoi tornare alla stazione che l’ha trasmesso.
  - title: Ritrovalo più tardi
    body: La cronologia dei brani conserva titoli e artisti scoperti durante l’ascolto. Salva le informazioni sui brani anziché registrazioni audio.
song_art_label: DA UN MOMENTO A UN RICORDO
song_art_text: Quel brano di cui non sapevi di aver bisogno.
song_note: "Alcune stazioni supportano solo l’ascolto di base. Riconoscimento e visualizzazioni che reagiscono all’audio dipendono dal flusso. Il riconoscimento brani non è supportato su Apple Watch."
everyday_eyebrow: BUONA COMPAGNIA, TUTTO IL GIORNO
everyday_title: Fai spazio all’ascolto.
everyday_body: Piccole attenzioni per il ritmo delle tue giornate.
scenes:
  - number: "01"
    title: Rilassati con i tuoi tempi.
    body: Scegli una durata preimpostata gratuita per il timer di spegnimento e lascia che la riproduzione si fermi quando è ora di riposare. Pro aggiunge una durata personalizzata.
    label: Timer di spegnimento
  - number: "02"
    title: Porta le tue stazioni con te.
    body: "L’ascolto di base con CarPlay è incluso. Pro aggiunge la vista dedicata alla guida e la navigazione per genere e stato d’animo in CarPlay. La disponibilità dipende dalla tua configurazione."
    label: Guida e CarPlay
  - number: "03"
    title: Inizia con qualcosa che ami.
    body: "Porta la tua stazione preferita nella routine del mattino. Qualcosa da aspettare con piacere quando inizia la giornata."
    label: Sveglia radio*
alarm_note: "* La sveglia radio è una funzione Pro che richiede iOS 26 o versioni successive e l’autorizzazione alle sveglie. La sveglia di sistema suona per prima; tocca Apri stazione per iniziare ad ascoltare."
devices_eyebrow: A CASA NEL TUO MONDO APPLE
devices_title: Familiare ovunque ascolti.
devices_body: "Un’esperienza nativa per iPhone, iPad, Mac e Apple Watch. Le funzioni variano in base al dispositivo."
devices:
  - {name: iPhone e iPad, requirement: "Richiede iOS / iPadOS 18+", body: "AirPlay, controlli nella schermata di blocco e un’esperienza di ascolto nativa."}
  - {name: Mac, requirement: "Richiede macOS 15+", body: Un’app nativa dedicata per la tua scrivania e la tua giornata.}
  - {name: Apple Watch, requirement: "Richiede watchOS 11+", body: "Preferiti, stazioni recenti e stazioni personalizzate si sincronizzano con l’iPhone abbinato."}
faq_eyebrow: PRIMA DI SINTONIZZARTI
faq_title: Alcune cose da sapere.
faqs:
  - question: Ting Radio è gratuita?
    answer: "Ting Radio si scarica gratuitamente. L’ascolto quotidiano della radio, i preferiti, le stazioni personalizzate e le durate preimpostate del timer di spegnimento sono inclusi. Pro offre altri modi per goderti le tue stazioni."
  - question: Posso ascoltare offline o registrare un programma?
    answer: "Ting Radio trasmette radio in diretta via internet. Non offre registrazioni offline né il riascolto dei programmi. Le stazioni controllano i propri flussi, contenuti e disponibilità."
  - question: Tutto si sincronizzerà tra i miei dispositivi?
    answer: "Ting Radio supporta la sincronizzazione delle stazioni tra iPhone e l’Apple Watch abbinato. Non viene promessa una sincronizzazione completa della libreria tramite account su tutte le piattaforme."
  - question: Pro elimina la pubblicità delle stazioni radio?
    answer: "La pubblicità trasmessa da una stazione fa parte del suo flusso audio. Ting Radio non può eliminarla e Pro non include la rimozione della pubblicità."
