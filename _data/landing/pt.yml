intro_label: Um novo capítulo para o Ting Radio
intro_text: "Menos procurar. Mais ouvir. Uma app nativa renovada que aproxima as descobertas, as tuas estações favoritas e as músicas que encontras pelo caminho."
discovery_eyebrow: POR DENTRO DO TING RADIO
discovery_title: "Escolhe uma estação.\nFica pelas descobertas."
discovery_body: "Da escolha da próxima estação à memória de uma música, um pequeno olhar sobre como funciona o Ting Radio."
discovery_note: "As descobertas baseiam-se nas tuas preferências e no teu histórico de escuta. Os favoritos e os URL de estações personalizadas mantêm por perto o teu cantinho da rádio."
