features_eyebrow: OUVE À TUA MANEIRA
features_title: Um pouco mais em cada escuta.
features_body: O essencial do dia a dia está incluído. Pro acrescenta mais formas de desfrutar das tuas estações.
feature_items:
  - icon: radio
    title: Descobre e guarda
    body: Explora por género, estado de espírito, região ou idioma e mantém os favoritos por perto. Também podes adicionar os teus próprios URL de estações.
    entitlement: Incluído
  - icon: recognition
    title: Reconhecimento e letras
    body: Identifica o áudio de estações compatíveis e acompanha as letras quando disponíveis.
    entitlement: Quota diária gratuita · Sem limite com Pro
  - icon: history
    title: Histórico de músicas
    body: Revisita as músicas que descobres, com títulos, artistas e detalhes da estação. São guardadas como informações, não como gravações.
    entitlement: Incluído
  - icon: moon
    title: Temporizador
    body: Escolhe uma duração predefinida e deixa a reprodução parar quando chegar a hora de descansar.
    entitlement: Durações predefinidas incluídas · Personalizada com Pro
  - icon: car
    title: Condução e CarPlay
    body: Mantém as estações à mão com a escuta básica do CarPlay ou a vista de condução dedicada de Pro.
    entitlement: CarPlay básico incluído · Condução e navegação CarPlay com Pro
  - icon: alarm
    title: Despertar com rádio
    body: Escolhe uma estação para a rotina da manhã. Toca em Abrir estação depois de o alarme do sistema tocar para começar a ouvir.
    entitlement: Pro · iOS 26+
