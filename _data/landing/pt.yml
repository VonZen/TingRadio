song_eyebrow: NÃO DEIXES ESCAPAR UMA BOA MÚSICA
song_title: "Ouviste.\nGuardaste."
song_body: "Uma música favorita pode aparecer quando menos esperas. Identifica o áudio de estações compatíveis, acompanha as letras disponíveis e revisita o teu histórico de músicas."
song_steps:
  - title: Dá um nome à música
    body: Usa o reconhecimento de músicas enquanto uma estação compatível está a tocar. A disponibilidade depende da transmissão e do dispositivo.
  - title: Acompanha as palavras
    body: Segue as letras sincronizadas quando disponíveis. A sincronização e o destaque das palavras dependem das letras fornecidas para a música.
  - title: Encontra-a mais tarde
    body: O histórico de músicas guarda os títulos e os artistas descobertos durante a escuta. Guarda informações sobre as músicas, em vez de gravações de áudio.
song_art_label: DE UM INSTANTE A UMA MEMÓRIA
song_art_text: Aquela música de que precisavas sem saber.
song_note: "Algumas estações apenas permitem a escuta básica. As letras, o reconhecimento e os efeitos visuais que reagem ao áudio dependem da transmissão. O reconhecimento de músicas não está disponível no Apple Watch."
everyday_eyebrow: BOA COMPANHIA, TODO O DIA
everyday_title: Abre espaço para ouvir.
everyday_body: Pequenos pormenores pensados para o verdadeiro ritmo do teu dia.
scenes:
  - number: "01"
    title: Descansa ao teu ritmo.
    body: Escolhe uma duração predefinida do temporizador gratuito e deixa a reprodução parar quando chegar a hora de descansar. Pro acrescenta uma duração personalizada.
    label: Temporizador
  - number: "02"
    title: Leva as tuas estações contigo.
    body: "A escuta básica com CarPlay está incluída. Pro acrescenta a vista dedicada à condução e a navegação por género e estado de espírito no CarPlay. A disponibilidade depende do teu equipamento."
    label: Condução e CarPlay
  - number: "03"
    title: Começa com algo de que gostas.
    body: "Traz a tua estação favorita para a rotina da manhã. Algo pelo qual esperar quando o dia começa."
    label: Despertar com rádio*
alarm_note: "* Despertar com rádio é uma funcionalidade Pro que requer iOS 26 ou posterior e permissão para alarmes. O alarme do sistema toca primeiro; toca em Abrir estação para começar a ouvir."
devices_eyebrow: EM CASA NO TEU MUNDO APPLE
devices_title: Familiar, onde quer que ouças.
devices_body: "Uma experiência nativa para iPhone, iPad, Mac e Apple Watch. As funcionalidades variam consoante o dispositivo."
devices:
  - {name: iPhone e iPad, requirement: "Requer iOS / iPadOS 18+", body: "AirPlay, controlos no ecrã bloqueado e uma experiência de escuta nativa."}
  - {name: Mac, requirement: "Requer macOS 15+", body: Uma app nativa dedicada à tua secretária e ao teu dia a dia.}
  - {name: Apple Watch, requirement: "Requer watchOS 11+", body: "Os favoritos, as estações recentes e as estações personalizadas sincronizam com o iPhone emparelhado."}
faq_eyebrow: ANTES DE SINTONIZARES
faq_title: Algumas coisas a saber.
faqs:
  - question: O Ting Radio é gratuito?
    answer: "O Ting Radio é gratuito para descarregar. A escuta diária de rádio, os favoritos, as estações personalizadas e as durações predefinidas do temporizador estão incluídos. Pro acrescenta mais formas de desfrutar das tuas estações."
  - question: Posso ouvir sem ligação ou gravar um programa?
    answer: "O Ting Radio transmite rádio em direto pela internet. Não disponibiliza gravações para ouvir sem ligação nem repetição de programas. As estações controlam as suas próprias transmissões, conteúdos e disponibilidade."
  - question: Tudo será sincronizado entre os meus dispositivos?
    answer: "O Ting Radio permite sincronizar estações entre o iPhone e o Apple Watch emparelhado. Não é prometida uma sincronização completa da biblioteca através de uma conta em todas as plataformas."
  - question: Pro remove os anúncios das estações de rádio?
    answer: "Os anúncios emitidos por uma estação fazem parte da sua própria transmissão de áudio. O Ting Radio não os pode remover, e Pro não inclui a remoção de anúncios."
