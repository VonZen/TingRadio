song_eyebrow: 別讓好歌擦身而過
song_title: "偶然聽見，\n也能好好記住。"
song_body: "喜歡的歌，往往來得不經意。辨識支援的電台音訊，在歌曲歷史中找回那些聽過的名字。"
song_steps:
  - title: 為好歌找到名字
    body: 在支援的電台播放時使用歌曲辨識，能否使用取決於串流與裝置。
  - title: 記住在哪裡聽到
    body: 每首歌都會保留電台名稱與資訊，方便回到播放它的那個電台。
  - title: 以後，也找得到
    body: 歌曲歷史保留收聽時發現的歌名與藝人資訊，方便回顧。儲存的是歌曲資訊，而非音訊錄音。
song_art_label: 把一瞬間，留成一段記憶
song_art_text: 原來，這就是剛才那首歌。
song_note: "部分電台僅支援基本播放；歌曲辨識和隨音訊變化的視覺效果取決於串流。Apple Watch 不支援歌曲辨識。"
everyday_eyebrow: 從早到晚，好聲音相伴
everyday_title: 給聆聽，留一個位置。
everyday_body: 一些貼心的小功能，陪你走過一天裡的不同片刻。
scenes:
  - number: "01"
    title: 慢慢聽，安心入睡。
    body: 選擇免費的睡眠定時預設，讓播放在休息時結束。Pro 還支援自訂時長。
    label: 睡眠定時
  - number: "02"
    title: 熟悉的電台，一路相伴。
    body: "免費版包含 CarPlay 基本播放。Pro 增加專用駕駛畫面，以及 CarPlay 中的曲風與心情探索。實際可用性取決於裝置與使用環境。"
    label: 駕駛與 CarPlay
  - number: "03"
    title: 從喜歡的聲音開始一天。
    body: "把喜歡的電台與起床時間放在一起，讓清晨多一份期待。"
    label: 電台自動叫醒*
alarm_note: "* 電台自動叫醒為 Pro 功能，需要 iOS 26 或以上版本及鬧鐘權限。系統鬧鐘先響鈴，再點按「開啟電台」開始收聽。"
devices_eyebrow: 在你的 APPLE 裝置上，自然相伴
devices_title: 換個地方，依然熟悉。
devices_body: "在 iPhone、iPad、Mac 和 Apple Watch 上，享受熟悉的原生體驗。實際功能依裝置而異。"
devices:
  - {name: iPhone 與 iPad, requirement: "需要 iOS / iPadOS 18+", body: "AirPlay、鎖定畫面控制，以及自然順手的原生收聽體驗。"}
  - {name: Mac, requirement: "需要 macOS 15+", body: 為桌面打造的原生 App，陪伴工作，也陪伴閒暇。}
  - {name: Apple Watch, requirement: "需要 watchOS 11+", body: 與配對的 iPhone 同步收藏、最近收聽和自訂電台。}
faq_eyebrow: 開始聆聽之前
faq_title: 你可能想知道。
faqs:
  - question: Ting Radio 是免費的嗎？
    answer: "Ting Radio 可以免費下載。日常電台收聽、收藏、自訂電台和睡眠定時預設均包含在免費版中，Pro 則提供更多收聽功能。"
  - question: 可以離線聽，或者錄下節目嗎？
    answer: "Ting Radio 透過網際網路收聽直播電台。不提供離線錄音或節目重播。電台自行決定串流、內容與服務可用性。"
  - question: 所有裝置都會同步嗎？
    answer: "Ting Radio 支援 iPhone 與配對 Apple Watch 的電台同步；目前不承諾所有平台之間透過帳號同步完整媒體庫。"
  - question: Pro 能移除電台裡的廣告嗎？
    answer: "電台播出的廣告屬於其本身的音訊串流，Ting Radio 無法移除。Pro 權益也不包含移除廣告。"
