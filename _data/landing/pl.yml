  - icon: car
    title: Jazda i CarPlay
    body: Miej stacje pod ręką dzięki podstawowemu słuchaniu przez CarPlay lub osobnemu widokowi jazdy w Pro.
    entitlement: Podstawowe CarPlay bezpłatnie · Jazda i odkrywanie z Pro
  - icon: alarm
    title: Budzenie z radiem
    body: Wybierz stację na poranek. Po alarmie systemowym stuknij „Otwórz stację”, aby zacząć słuchać.
