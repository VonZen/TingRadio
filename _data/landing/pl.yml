intro_label: Nowy rozdział Ting Radio
intro_text: "Mniej szukania. Więcej słuchania. Odświeżona natywna aplikacja łączy odkrywanie, ulubione stacje i utwory napotkane po drodze."
discovery_eyebrow: W ŚRODKU TING RADIO
discovery_title: "Znajdź stację.\nZostań dla odkryć."
discovery_body: "Od wyboru kolejnej stacji po zapamiętanie piosenki — zobacz, jak działa Ting Radio."
discovery_note: "Odkrywanie uwzględnia Twoje preferencje i historię słuchania. Ulubione i własne adresy stacji pozwalają mieć swój radiowy zakątek zawsze blisko."
