features_eyebrow: SŁUCHAJ PO SWOJEMU
features_title: Więcej w każdej chwili słuchania.
features_body: Codzienne funkcje są bezpłatne. Pro dodaje więcej sposobów korzystania ze stacji.
feature_items:
  - icon: radio
    title: Odkrywaj i zapisuj
    body: Przeglądaj według gatunku, nastroju, regionu lub języka i zachowaj ulubione stacje. Możesz też dodać własne adresy.
