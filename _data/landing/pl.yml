song_eyebrow: NIE POZWÓL DOBREJ PIOSENCE UMKNĄĆ
song_title: "Usłysz.\nZapamiętaj."
song_body: "Ulubiona piosenka może pojawić się niespodziewanie. Rozpoznawaj utwory z obsługiwanych stacji, śledź dostępne teksty i wracaj do historii utworów."
song_steps:
  - title: Poznaj tytuł piosenki
    body: Użyj rozpoznawania utworów podczas odtwarzania obsługiwanej stacji. Dostępność zależy od strumienia i urządzenia.
  - title: Podążaj za słowami
    body: Śledź zsynchronizowane teksty, jeśli są dostępne. Synchronizacja i wyróżnianie słów zależą od danych tekstu danego utworu.
  - title: Znajdź ją ponownie
    body: Historia utworów zachowuje tytuły i wykonawców odkrytych podczas słuchania. Zapisuje informacje o utworach, a nie nagrania dźwięku.
song_art_label: OD CHWILI DO WSPOMNIENIA
song_art_text: Piosenka, której potrzebujesz, choć jeszcze o tym nie wiesz.
song_note: "Niektóre stacje obsługują tylko podstawowe słuchanie. Teksty, rozpoznawanie i wizualizacje reagujące na dźwięk zależą od strumienia. Rozpoznawanie utworów nie jest obsługiwane na Apple Watch."
everyday_eyebrow: DOBRE TOWARZYSTWO PRZEZ CAŁY DZIEŃ
everyday_title: Znajdź miejsce na słuchanie.
everyday_body: Kilka przemyślanych szczegółów dopasowanych do rytmu Twojego dnia.
scenes:
  - number: "01"
    title: Odpoczywaj na swoich zasadach.
    body: Wybierz bezpłatny gotowy czas wyłącznika i pozwól, by odtwarzanie skończyło się, gdy pora odpocząć. Pro pozwala ustawić własny czas.
    label: Wyłącznik czasowy
  - number: "02"
    title: Zabierz stacje ze sobą.
    body: "Podstawowe słuchanie przez CarPlay jest bezpłatne. Pro dodaje osobny widok jazdy i przeglądanie według gatunku i nastroju w CarPlay. Dostępność zależy od Twojego sprzętu."
    label: Jazda i CarPlay
  - number: "03"
    title: Zacznij od tego, co lubisz.
    body: "Włącz ulubioną stację do porannej rutyny. Niech początek dnia przynosi coś miłego."
    label: Budzenie z radiem*
alarm_note: "* Budzenie z radiem to funkcja Pro wymagająca iOS 26 lub nowszego i uprawnienia do alarmów. Najpierw dzwoni alarm systemowy; stuknij „Otwórz stację”, aby zacząć słuchać."
devices_eyebrow: W TWOIM ŚWIECIE APPLE
devices_title: Znajomo wszędzie, gdzie słuchasz.
devices_body: "Natywna aplikacja na iPhone, iPad, Mac i Apple Watch. Funkcje różnią się zależnie od urządzenia."
devices:
  - {name: iPhone i iPad, requirement: "Wymaga iOS / iPadOS 18+", body: "AirPlay, sterowanie na ekranie blokady i natywne środowisko słuchania."}
  - {name: Mac, requirement: "Wymaga macOS 15+", body: Osobna natywna aplikacja na Twoje biurko i na co dzień.}
  - {name: Apple Watch, requirement: "Wymaga watchOS 11+", body: Ulubione oraz ostatnie i własne stacje synchronizują się ze sparowanym iPhonem.}
faq_eyebrow: ZANIM ZACZNIESZ SŁUCHAĆ
faq_title: Kilka przydatnych informacji.
faqs:
  - question: Czy Ting Radio jest bezpłatne?
    answer: "Ting Radio można pobrać bezpłatnie. Zawiera codzienne słuchanie radia, ulubione, własne stacje i gotowe czasy wyłącznika. Pro dodaje więcej sposobów korzystania ze stacji."
  - question: Czy mogę słuchać offline lub nagrać audycję?
    answer: "Ting Radio przesyła radio na żywo przez internet. Nie oferuje nagrań offline ani powtórek audycji. Stacje same kontrolują swoje strumienie, treści i dostępność."
  - question: Czy wszystko zsynchronizuje się między urządzeniami?
    answer: "Ting Radio obsługuje synchronizację stacji między iPhonem i sparowanym Apple Watch. Nie obiecuje pełnej synchronizacji biblioteki przez konto na wszystkich platformach."
  - question: Czy Pro usuwa reklamy ze stacji radiowych?
    answer: "Reklamy nadawane przez stację są częścią jej strumienia dźwięku. Ting Radio nie może ich usunąć, a Pro nie obejmuje usuwania reklam."
