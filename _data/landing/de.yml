  - {name: iPhone & iPad, requirement: "Erfordert iOS / iPadOS 18+", body: "AirPlay, Steuerelemente auf dem Sperrbildschirm und ein natives Hörerlebnis."}
  - {name: Mac, requirement: "Erfordert macOS 15+", body: Eine eigene native App für deinen Schreibtisch und deinen Tag.}
  - {name: Apple Watch, requirement: "Erfordert watchOS 11+", body: "Favoriten, zuletzt gehörte Sender und eigene Sender werden mit deinem gekoppelten iPhone synchronisiert."}
faq_eyebrow: BEVOR DU EINSCHALTEST
faq_title: Ein paar Dinge vorab.
faqs:
  - question: Ist Ting Radio kostenlos?
    answer: "Ting Radio lässt sich kostenlos laden. Radio hören, Favoriten, eigene Sender und Vorgaben für den Sleep-Timer sind enthalten. Mit Pro kannst du deine Sender auf weitere Arten genießen."
  - question: Kann ich offline hören oder eine Sendung aufnehmen?
    answer: "Ting Radio überträgt Live-Radio über das Internet. Offline-Aufnahmen oder das spätere Abspielen von Sendungen werden nicht angeboten. Die Sender bestimmen selbst über ihre Streams, Inhalte und Verfügbarkeit."
  - question: Wird alles zwischen meinen Geräten synchronisiert?
    answer: "Ting Radio unterstützt die Synchronisierung von Sendern zwischen dem iPhone und seiner gekoppelten Apple Watch. Eine vollständige, kontobasierte Synchronisierung der Mediathek über alle Plattformen wird nicht zugesagt."
  - question: Entfernt Pro Werbung aus Radiosendern?
    answer: "Werbung, die ein Sender ausstrahlt, ist Teil seines Audio-Streams. Ting Radio kann sie nicht entfernen. Auch Pro bietet keine Entfernung dieser Werbung."
