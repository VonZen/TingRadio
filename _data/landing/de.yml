song_eyebrow: LASS EINEN GUTEN SONG NICHT ZIEHEN
song_title: "Gehört.\nGemerkt."
song_body: "Ein Lieblingssong kann dich ganz unerwartet finden. Erkenne Songs aus unterstützten Radio-Streams, lies verfügbare Songtexte mit und stöbere in deinem Songverlauf."
song_steps:
  - title: Gib dem Song einen Namen
    body: Nutze die Titel-Erkennung, während ein unterstützter Sender läuft. Die Verfügbarkeit hängt vom Stream und vom Gerät ab.
  - title: Bleib bei den Worten
    body: Lies synchronisierte Songtexte mit, wenn sie verfügbar sind. Zeitliche Abstimmung und Wortmarkierungen hängen von den gelieferten Songtexten ab.
  - title: Finde ihn später wieder
    body: Der Songverlauf merkt sich Titel und Interpreten, die du beim Hören entdeckt hast. Er speichert Songinformationen, keine Audioaufnahmen.
song_art_label: AUS EINEM MOMENT WIRD EINE ERINNERUNG
song_art_text: Der Song, von dem du nicht wusstest, dass er dir fehlt.
song_note: "Manche Sender unterstützen nur die grundlegende Wiedergabe. Songtexte, Titel-Erkennung und Visualisierungen, die auf Musik reagieren, hängen vom Stream ab. Die Titel-Erkennung wird auf der Apple Watch nicht unterstützt."
everyday_eyebrow: GUTE GESELLSCHAFT, DEN GANZEN TAG
everyday_title: Nimm dir Zeit zum Hören.
everyday_body: Kleine, durchdachte Details für deinen Alltag.
scenes:
  - number: "01"
    title: Komm zur Ruhe. In deinem Tempo.
    body: Wähle eine kostenlose Vorgabe für den Sleep-Timer und lass die Wiedergabe enden, wenn es Zeit zum Ausruhen ist. Mit Pro kannst du die Dauer selbst festlegen.
    label: Sleep-Timer
  - number: "02"
    title: Nimm deine Sender mit.
    body: "Grundlegendes Hören mit CarPlay ist enthalten. Pro ergänzt den Fahrmodus und das Stöbern nach Genre und Stimmung in CarPlay. Die Verfügbarkeit hängt von deiner Ausstattung ab."
    label: Fahrmodus & CarPlay
  - number: "03"
    title: Starte mit etwas, das du liebst.
    body: "Mach deinen Lieblingssender zum Teil deiner Morgenroutine. Etwas, auf das du dich schon beim Aufwachen freuen kannst."
    label: Radiowecker*
alarm_note: "* Der Radiowecker ist eine Pro-Funktion und erfordert iOS 26 oder neuer sowie die Berechtigung für Wecker. Zuerst klingelt der Systemwecker; tippe auf Sender öffnen, um zuzuhören."
devices_eyebrow: ZU HAUSE IN DEINER APPLE-WELT
devices_title: Vertraut, wo immer du hörst.
devices_body: "Eine native App für iPhone, iPad, Mac und Apple Watch. Die Funktionen unterscheiden sich je nach Gerät."
