song_eyebrow: LAAT EEN MOOI NUMMER NIET ONTSNAPPEN
song_title: "Gehoord.\nOnthouden."
song_body: "Een favoriet nummer kan opduiken wanneer je het niet verwacht. Herken audio van ondersteunde radiostreams, volg beschikbare songteksten en kijk terug in je nummergeschiedenis."
song_steps:
  - title: Geef het nummer een naam
    body: Gebruik nummerherkenning terwijl een ondersteund station speelt. De beschikbaarheid hangt af van de stream en het apparaat.
  - title: Volg de woorden
    body: Volg gesynchroniseerde songteksten wanneer die beschikbaar zijn. De timing en gemarkeerde woorden hangen af van de aangeleverde songtekst.
  - title: Vind het later terug
    body: De nummergeschiedenis bewaart titels en artiesten die je tijdens het luisteren ontdekt. Ze bewaart informatie over nummers in plaats van audio-opnamen.
song_art_label: VAN EEN MOMENT NAAR EEN HERINNERING
song_art_text: Dat nummer waarvan je niet wist dat je het nodig had.
song_note: "Sommige stations ondersteunen alleen eenvoudig luisteren. Songteksten, herkenning en beelden die op de audio reageren zijn afhankelijk van de stream. Nummerherkenning wordt niet ondersteund op Apple Watch."
everyday_eyebrow: GOED GEZELSCHAP, DE HELE DAG
everyday_title: Maak ruimte om te luisteren.
everyday_body: Een paar doordachte details die passen bij jouw dag.
scenes:
  - number: "01"
    title: Kom tot rust op jouw manier.
    body: Kies een gratis vaste duur voor de slaaptimer en laat de muziek stoppen wanneer het tijd is om te rusten. Met Pro kun je zelf een duur instellen.
    label: Slaaptimer
  - number: "02"
    title: Neem je stations mee.
    body: "Gewoon luisteren via CarPlay is inbegrepen. Pro voegt de speciale rijmodus en bladeren op genre en stemming in CarPlay toe. De beschikbaarheid hangt af van je opstelling."
    label: Rijden en CarPlay
  - number: "03"
    title: Begin met iets waar je van houdt.
    body: "Geef je favoriete station een plek in je ochtendroutine. Iets om naar uit te kijken wanneer de dag begint."
    label: Radiowekker*
alarm_note: "* De radiowekker is een Pro-functie waarvoor iOS 26 of nieuwer en toestemming voor wekkers nodig zijn. Eerst gaat het systeemalarm af; tik op Open station om te luisteren."
devices_eyebrow: THUIS IN JOUW APPLE-WERELD
devices_title: Vertrouwd, waar je ook luistert.
devices_body: "Een native ervaring voor iPhone, iPad, Mac en Apple Watch. De functies verschillen per apparaat."
devices:
  - {name: iPhone en iPad, requirement: "Vereist iOS / iPadOS 18+", body: "AirPlay, bediening op het toegangsscherm en een native luisterervaring."}
  - {name: Mac, requirement: "Vereist macOS 15+", body: Een eigen native app voor je bureau en je dag.}
  - {name: Apple Watch, requirement: "Vereist watchOS 11+", body: "Favorieten, recente stations en aangepaste stations worden gesynchroniseerd met je gekoppelde iPhone."}
faq_eyebrow: VOORDAT JE AFSTEMT
faq_title: Een paar dingen om te weten.
faqs:
  - question: Is Ting Radio gratis?
    answer: "Ting Radio is gratis te downloaden. Dagelijks radio luisteren, favorieten, aangepaste stations en vaste duren voor de slaaptimer zijn inbegrepen. Pro biedt meer manieren om van je stations te genieten."
  - question: Kan ik offline luisteren of een programma opnemen?
    answer: "Ting Radio streamt live radio via internet. De app biedt geen offline opnamen of terugluisteren van programma’s. Stations bepalen zelf hun streams, inhoud en beschikbaarheid."
  - question: Wordt alles tussen mijn apparaten gesynchroniseerd?
    answer: "Ting Radio ondersteunt de synchronisatie van stations tussen iPhone en de gekoppelde Apple Watch. Volledige synchronisatie van de bibliotheek via een account op alle platforms wordt niet beloofd."
  - question: Verwijdert Pro advertenties van radiostations?
    answer: "Advertenties die een station uitzendt, maken deel uit van de eigen audiostream. Ting Radio kan ze niet verwijderen en Pro biedt geen verwijdering van advertenties."
