intro_label: Een nieuw hoofdstuk voor Ting Radio
intro_text: "Minder zoeken. Meer luisteren. Een vernieuwde native app die nieuwe ontdekkingen, je favoriete stations en de nummers die je onderweg tegenkomt dichter bij elkaar brengt."
discovery_eyebrow: IN TING RADIO
discovery_title: "Vind een station.\nBlijf ontdekken."
discovery_body: "Van je volgende station kiezen tot een nummer onthouden: zo werkt Ting Radio."
discovery_note: "Ontdekken houdt rekening met je voorkeuren en luistergeschiedenis. Favorieten en eigen station-URL’s houden jouw stukje radio dichtbij."
