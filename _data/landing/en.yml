faq_eyebrow: BEFORE YOU TUNE IN
faq_title: A few things to know.
faqs:
  - question: Is Ting Radio free?
    answer: "Ting Radio is free to download. Everyday radio listening, favourites, custom stations, and sleep-timer presets are included. Pro adds more ways to enjoy your stations."
  - question: Can I listen offline or record a show?
    answer: "Ting Radio streams live radio over the internet. It does not offer offline recordings or programme replay. Stations control their own streams, content, and availability."
  - question: Will everything sync across my devices?
    answer: "Ting Radio supports companion station sync between iPhone and its paired Apple Watch. Full account-based library sync across all platforms is not promised."
  - question: Does Pro remove ads from radio stations?
    answer: "Ads broadcast by a station are part of its own audio stream. Ting Radio cannot remove them, and Pro does not include ad removal."
