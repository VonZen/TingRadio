song_eyebrow: DON’T LET A GOOD SONG GO
song_title: "Heard it.\nKeep it."
song_body: "A favourite song can arrive when you least expect it. Identify supported radio audio, follow available lyrics, and revisit your song history."
song_steps:
  - title: Put a name to the song
    body: Use song recognition while a supported station plays. Availability depends on the stream and device.
  - title: Stay with the words
    body: Follow synchronised lyrics when available. Timing and word highlights depend on the lyrics supplied for the song.
  - title: Find it again later
    body: Song history keeps the titles and artists discovered during listening. It saves song information, rather than audio recordings.
song_art_label: FROM A MOMENT TO A MEMORY
song_art_text: That song you didn’t know you needed.
song_note: "Some stations support basic listening only. Lyrics, recognition, and audio-reactive visuals depend on the stream. Song recognition is not supported on Apple Watch."
everyday_eyebrow: GOOD COMPANY, ALL DAY
everyday_title: Make room for listening.
everyday_body: A few thoughtful touches for the way your day actually moves.
scenes:
  - number: "01"
    title: Wind down, on your terms.
    body: Choose a free sleep-timer preset and let playback stop when it’s time to rest. Pro adds a custom duration.
    label: Sleep timer
  - number: "02"
    title: Take your stations along.
    body: "Basic CarPlay listening is included. Pro adds the dedicated driving view and genre and mood browsing in CarPlay. Availability depends on your setup."
    label: Driving & CarPlay
  - number: "03"
    title: Start with something you love.
    body: "Bring your favourite station into your morning routine. Something to look forward to when the day begins."
    label: Radio wake-up*
alarm_note: "* Radio wake-up is a Pro feature requiring iOS 26 or later and alarm permission. The system alarm rings first; tap Open Station to begin listening."
