intro_label: Ένα νέο κεφάλαιο για το Ting Radio
intro_text: "Λιγότερη αναζήτηση. Περισσότερη ακρόαση. Μια ανανεωμένη εγγενής εφαρμογή που φέρνει πιο κοντά τις ανακαλύψεις, τους αγαπημένους σου σταθμούς και τα τραγούδια που βρίσκεις στην πορεία."
discovery_eyebrow: ΜΕΣΑ ΣΤΟ TING RADIO
discovery_title: "Βρες έναν σταθμό.\nΑνακάλυψε περισσότερα."
discovery_body: "Από την επιλογή σταθμού μέχρι τα τραγούδια που θέλεις να θυμάσαι: μια ματιά στο πώς λειτουργεί το Ting Radio."
discovery_note: "Η ανακάλυψη βασίζεται στις προτιμήσεις και το ιστορικό ακρόασής σου. Τα αγαπημένα και οι δικές σου διευθύνσεις σταθμών κρατούν κοντά σου το ραδιόφωνο που αγαπάς."
discovery_items:
  - {name: Τζαζ, detail: Ένα πιο αργό απόγευμα., image: jazz.webp, alt: Σαξόφωνο σε ζεστό φωτισμό, kind: Είδος}
  - {name: Συγκέντρωση, detail: Λίγος χώρος για σκέψη., image: focus.webp, alt: Βιβλία και επιτραπέζια λάμπα με ζεστό φως, kind: Διάθεση}
  - {name: Κλασική, detail: Άφησε τη μέρα να κυλήσει., image: classical.webp, alt: Κοντινή λήψη ενός βιολιού, kind: Είδος}
  - {name: Χαλάρωση, detail: Πάρε τον πιο μακρύ δρόμο για το σπίτι., image: chill.webp, alt: Ομίχλη πάνω από μια ήσυχη λίμνη στο δάσος, kind: Διάθεση}
song_eyebrow: ΜΗ ΧΑΣΕΙΣ ΕΝΑ ΩΡΑΙΟ ΤΡΑΓΟΥΔΙ
song_title: "Το άκουσες.\nΤο κράτησες."
song_body: "Ένα αγαπημένο τραγούδι μπορεί να ακουστεί εκεί που δεν το περιμένεις. Αναγνώρισε ήχο από υποστηριζόμενους σταθμούς, ακολούθησε τους διαθέσιμους στίχους και επέστρεψε στο ιστορικό τραγουδιών σου."
song_steps:
  - title: Βρες το όνομα του τραγουδιού
    body: Χρησιμοποίησε την αναγνώριση τραγουδιών όσο παίζει ένας υποστηριζόμενος σταθμός. Η διαθεσιμότητα εξαρτάται από τη ροή και τη συσκευή.
  - title: Ακολούθησε τις λέξεις
    body: Δες συγχρονισμένους στίχους όταν είναι διαθέσιμοι. Ο συγχρονισμός και η επισήμανση λέξεων εξαρτώνται από τα δεδομένα στίχων του τραγουδιού.
  - title: Βρες το ξανά αργότερα
    body: Το ιστορικό τραγουδιών κρατά τίτλους και καλλιτέχνες που ανακαλύπτεις στην ακρόαση. Αποθηκεύει πληροφορίες τραγουδιών και όχι ηχογραφήσεις.
song_art_label: ΑΠΟ ΜΙΑ ΣΤΙΓΜΗ ΣΕ ΜΙΑ ΑΝΑΜΝΗΣΗ
song_art_text: Το τραγούδι που δεν ήξερες ότι σου έλειπε.
song_note: "Ορισμένοι σταθμοί υποστηρίζουν μόνο βασική ακρόαση. Οι στίχοι, η αναγνώριση και τα οπτικά εφέ που αντιδρούν στον ήχο εξαρτώνται από τη ροή. Η αναγνώριση τραγουδιών δεν υποστηρίζεται στο Apple Watch."
everyday_eyebrow: ΚΑΛΗ ΠΑΡΕΑ ΟΛΗ ΜΕΡΑ
everyday_title: Βρες χώρο για ακρόαση.
everyday_body: Μερικές προσεγμένες λεπτομέρειες για τον πραγματικό ρυθμό της ημέρας σου.
scenes:
  - number: "01"
    title: Χαλάρωσε με τον δικό σου τρόπο.
    body: Διάλεξε μια δωρεάν προεπιλογή χρονοδιακόπτη ύπνου και άφησε την αναπαραγωγή να σταματήσει όταν έρθει η ώρα για ξεκούραση. Το Pro προσθέτει προσαρμοσμένη διάρκεια.
    label: Χρονοδιακόπτης ύπνου
  - number: "02"
    title: Πάρε τους σταθμούς σου μαζί.
    body: "Η βασική ακρόαση μέσω CarPlay περιλαμβάνεται. Το Pro προσθέτει ειδική προβολή οδήγησης και περιήγηση ανά είδος και διάθεση στο CarPlay. Η διαθεσιμότητα εξαρτάται από τον εξοπλισμό σου."
    label: Οδήγηση και CarPlay
  - number: "03"
    title: Ξεκίνα με κάτι που αγαπάς.
    body: "Βάλε τον αγαπημένο σου σταθμό στην πρωινή σου συνήθεια. Κάτι όμορφο για την αρχή της ημέρας."
    label: Ξύπνημα με ραδιόφωνο*
alarm_note: "* Το ξύπνημα με ραδιόφωνο είναι λειτουργία Pro και απαιτεί iOS 26 ή νεότερο και άδεια για ξυπνητήρια. Πρώτα χτυπά το ξυπνητήρι του συστήματος· πάτησε «Άνοιγμα σταθμού» για να αρχίσεις την ακρόαση."
devices_eyebrow: ΣΤΟΝ ΔΙΚΟ ΣΟΥ ΚΟΣΜΟ APPLE
devices_title: Οικείο όπου κι αν ακούς.
devices_body: "Μια εγγενής εμπειρία για iPhone, iPad, Mac και Apple Watch. Οι λειτουργίες διαφέρουν ανά συσκευή."
devices:
  - {name: iPhone και iPad, requirement: "Απαιτεί iOS / iPadOS 18+", body: "AirPlay, χειριστήρια στην οθόνη κλειδώματος και εγγενής εμπειρία ακρόασης."}
  - {name: Mac, requirement: "Απαιτεί macOS 15+", body: Μια ξεχωριστή εγγενής εφαρμογή για το γραφείο και την ημέρα σου.}
  - {name: Apple Watch, requirement: "Απαιτεί watchOS 11+", body: Τα αγαπημένα και οι πρόσφατοι και προσαρμοσμένοι σταθμοί συγχρονίζονται με το ζευγοποιημένο iPhone.}
faq_eyebrow: ΠΡΙΝ ΣΥΝΤΟΝΙΣΤΕΙΣ
faq_title: Μερικά χρήσιμα πράγματα.
faqs:
  - question: Είναι δωρεάν το Ting Radio;
    answer: "Το Ting Radio διατίθεται για δωρεάν λήψη. Περιλαμβάνει καθημερινή ακρόαση ραδιοφώνου, αγαπημένα, προσαρμοσμένους σταθμούς και προεπιλογές χρονοδιακόπτη ύπνου. Το Pro προσθέτει περισσότερους τρόπους να απολαμβάνεις τους σταθμούς σου."
  - question: Μπορώ να ακούσω εκτός σύνδεσης ή να ηχογραφήσω μια εκπομπή;
    answer: "Το Ting Radio μεταδίδει ζωντανό ραδιόφωνο μέσω διαδικτύου. Δεν προσφέρει ηχογραφήσεις εκτός σύνδεσης ή επανάληψη εκπομπών. Οι σταθμοί ελέγχουν τις δικές τους ροές, το περιεχόμενο και τη διαθεσιμότητά τους."
  - question: Θα συγχρονίζονται όλα στις συσκευές μου;
    answer: "Το Ting Radio υποστηρίζει συγχρονισμό σταθμών μεταξύ iPhone και ζευγοποιημένου Apple Watch. Δεν υπόσχεται πλήρη συγχρονισμό βιβλιοθήκης μέσω λογαριασμού σε όλες τις πλατφόρμες."
  - question: Το Pro αφαιρεί τις διαφημίσεις των σταθμών;
    answer: "Οι διαφημίσεις ενός σταθμού αποτελούν μέρος της δικής του ροής ήχου. Το Ting Radio δεν μπορεί να τις αφαιρέσει και το Pro δεν περιλαμβάνει αφαίρεση διαφημίσεων."
