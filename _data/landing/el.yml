    body: Διάλεξε μια προεπιλεγμένη διάρκεια και άφησε την αναπαραγωγή να σταματήσει όταν έρθει η ώρα για ξεκούραση.
    entitlement: Προεπιλογές περιλαμβάνονται · Προσαρμοσμένη διάρκεια με Pro
